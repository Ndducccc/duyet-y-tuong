name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site/assets
          cp index.html _site/
          echo '' | base64 -d > _site/assets/icon-16.png
          echo '' | base64 -d > _site/assets/icon-32.png
          for n in 64 80; do (command -v convert >/dev/null && convert _site/assets/icon-32.png -filter Lanczos -resize ${n}x${n} _site/assets/icon-$n.png) || cp _site/assets/icon-32.png _site/assets/icon-$n.png; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@v4
